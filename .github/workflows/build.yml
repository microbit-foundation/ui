name: build
on:
  push:
    branches:
      - "**"
    # Publishing a GitHub release creates its tag; a draft has no tag yet.
    tags:
      - "*-v*"
env:
  # renovate: datasource=npm depName=npm
  NPM_VERSION: "11"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.x"
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm run format:check
      # Route a release to a package by its tag prefix: ui-vX.Y.Z,
      # ui-carousel-vX.Y.Z, ui-code-view-vX.Y.Z, ui-patterns-vX.Y.Z or
      # i18n-tools-vX.Y.Z. The versioner derives the version from the tag's
      # numeric part. Branch builds default to ui; nothing is published.
      - name: Route release tag to a package
        id: route
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          case "$TAG" in
            "") PACKAGE="ui" ;;
            ui-carousel-v[0-9]*) PACKAGE="ui-carousel" ;;
            ui-code-view-v[0-9]*) PACKAGE="ui-code-view" ;;
            ui-patterns-v[0-9]*) PACKAGE="ui-patterns" ;;
            i18n-tools-v[0-9]*) PACKAGE="i18n-tools" ;;
            ui-v[0-9]*) PACKAGE="ui" ;;
            *)
              echo "Unrecognised release tag '$TAG' (expected ui-vX.Y.Z, ui-carousel-vX.Y.Z, ui-code-view-vX.Y.Z, ui-patterns-vX.Y.Z or i18n-tools-vX.Y.Z)" >&2
              exit 1
              ;;
          esac
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
      - uses: microbit-foundation/npm-package-versioner-action@v3
        with:
          working-directory: packages/${{ steps.route.outputs.package }}
      - run: npm run ci
      - run: npm pack -w @microbit/${{ steps.route.outputs.package }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: npm-tarball
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 1
      # On main, hand the Storybook this run just built and checked to the
      # deploy job below.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.ref == 'refs/heads/main'
        with:
          path: apps/storybook/storybook-static

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm stage publish --allow-file=all ./*.tgz

  deploy-storybook:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Allow the GITHUB_TOKEN to deploy to Pages.
    permissions:
      pages: write
      id-token: write
    # Allow one concurrent deployment; don't cancel in-progress runs.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
